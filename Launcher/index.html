<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrucklineMP Real-Time Player Tracker</title>
  <!-- Load Chart.js for smooth data visualizations -->
  <script src="https://jsdelivr.net"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 30px;
    }
    header h1 {
      margin: 0 0 5px 0;
      font-size: 2.2rem;
      color: #38bdf8;
    }
    header p {
      margin: 0;
      color: #94a3b8;
      font-size: 1.1rem;
    }
    .chart-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      height: 450px;
    }
    .error-msg {
      color: #ef4444;
      text-align: center;
      padding-top: 150px;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>TrucklineMP Live Population</h1>
      <p>Actual community server population trends updated 24/7</p>
    </header>

    <!-- Main Live Graph Display -->
    <div class="chart-card" id="chartContainer">
      <canvas id="playerChart"></canvas>
    </div>
  </div>

  <script>
    async function loadTrackerGraph() {
      try {
        // Fetch the historical log database file generated by your GitHub launcher
        const response = await fetch('./history.json');
        if (!response.ok) throw new Error('History log file not generated yet');
        
        const historyData = await response.json();

        // Map data structures for ChartJS processing
        const timestamps = historyData.map(log => log.time);
        const playerCounts = historyData.map(log => log.players);

        const ctx = document.getElementById('playerChart').getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: timestamps,
            datasets: [{
              label: 'Active Players Online',
              data: playerCounts,
              borderColor: '#38bdf8',
              backgroundColor: 'rgba(56, 189, 248, 0.1)',
              borderWidth: 3,
              pointBackgroundColor: '#38bdf8',
              pointRadius: 2,
              tension: 0.3,
              fill: true
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                labels: { color: '#94a3b8', font: { size: 14 } }
              }
            },
            scales: {
              x: {
                grid: { color: '#334155' },
                ticks: { color: '#94a3b8' }
              },
              y: {
                beginAtZero: true,
                grid: { color: '#334155' },
                ticks: { color: '#94a3b8' }
              }
            }
          }
        });
      } catch (err) {
        console.error("Initialization error:", err);
        document.getElementById('chartContainer').innerHTML = `
          <div class="error-msg">
            📊 Waiting for the automated cloud bot to run its first sync cycle... <br>
            <span style="font-size: 0.9rem; color: #64748b; display: block; margin-top: 10px;">
              (This will clear up automatically within 10 minutes when history.json is built)
            </span>
          </div>
        `;
      }
    }

    window.addEventListener('DOMContentLoaded', loadTrackerGraph);
  </script>
</body>
</html>
